kind = "web"
previewPath = "/"
title = "MediQueue — Appointment & Queue System"
version = "1.0.0"
id = "artifacts/medi-queue"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20578

[services.development]
run = "pnpm --filter @workspace/medi-queue run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/medi-queue", "run", "build" ]
publicDir = "artifacts/medi-queue/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20578"
BASE_PATH = "/"
